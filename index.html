<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harper Tech Tools</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #eaeaea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }
  h1 span { color: #4fc3f7; }
  p {
    font-size: 1.25rem;
    color: #9aa0a6;
    max-width: 600px;
    line-height: 1.6;
  }
  .tag {
    margin-top: 2rem;
    padding: 0.4rem 1rem;
    border: 1px solid #4fc3f7;
    border-radius: 999px;
    font-size: 0.9rem;
    color: #4fc3f7;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <h1>Harper <span>Tech Tools</span></h1>
  <p>Internal tools and resources for the Harper Limbach service team. Built to make field work faster.</p>
  <div class="tag">TAMPA ROLLOUT</div>
</body>
</html>
